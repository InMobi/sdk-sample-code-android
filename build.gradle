// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        jcenter()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}


ext {
    androidMinSdkVersion = 21
    androidTargetSdkVersion = 36
    androidCompileSdkVersion = 36

    appVersionCode = 1
    appVersionName = "1.0.0"

    inmobiSdkVersion = "11.1.0"
    picasso = "2.8"
    browser = "1.3.0"
    recyclerview = "1.1.0"

    playservicesadsidentifier = "18.0.1"
    playserviceslocation = "19.0.1"

    playservicesappset = "16.0.2"
    playservicestask= "18.0.2"
}

allprojects {
    repositories {
        jcenter()
        google()
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Werror" << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}
